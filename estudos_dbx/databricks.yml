# This is a Databricks asset bundle definition for estudos_dbx.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: estudos_dbx
  uuid: bea64411-63f3-406f-a274-f36bb557ee7b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5e52a54c-2276.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-5e52a54c-2276.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/marceloacampos@outlook.com to make sure we only have a single copy.
      root_path: /Workspace/Users/marceloacampos@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: marceloacampos@outlook.com
        level: CAN_MANAGE
